# Optional local Postgres 16 for offline development and for mirroring CI.
# The default development database is Neon (docs/ops/neon-dev.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres  # local container only; never used elsewhere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
