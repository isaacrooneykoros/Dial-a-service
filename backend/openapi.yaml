openapi: 3.0.3
info:
  title: Dial A Service API
  version: 1.0.0
  description: One API for every business; the business comes from the host.
paths:
  /api/v1/app/version:
    get:
      operationId: app_version
      description: With no row for the app, every version is allowed (minimum "0.0.0").
      summary: X-01 / X-02 Minimum and latest version of an app
      parameters:
      - in: query
        name: app
        schema:
          type: string
          default: web
      - in: query
        name: platform
        schema:
          type: string
          default: web
      tags:
      - app
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersion'
          description: ''
  /api/v1/auth/invitations/{token}:
    get:
      operationId: auth_invitation_detail
      summary: X-14 What this invitation is
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInvitation'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/invitations/{token}/send-code:
    post:
      operationId: auth_invitation_send_code
      summary: X-14 Send code
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/invitations/{token}/verify:
    post:
      operationId: auth_invitation_verify
      summary: 'X-12 in the invitation flow: check the code'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupToken'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/invitations/accept:
    post:
      operationId: auth_invitation_accept
      summary: 'X-13 in the invitation flow: set a password; creates the account and
        signs in'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/login:
    post:
      operationId: auth_login
      summary: X-10 Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      summary: Sign out this device
      tags:
      - auth
      security:
      - bearerAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm
      summary: X-13 Set a new password after a reset; signs in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/password-reset/request:
    post:
      operationId: auth_password_reset_request
      summary: X-11 Send a reset code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/password-reset/verify:
    post:
      operationId: auth_password_reset_verify
      summary: X-12 Check the reset code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetToken'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change
      summary: Change my password; signs out my other sessions
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/pin-switch:
    post:
      operationId: auth_pin_switch
      description: 'X-15: identified by the das_device cookie; a PIN signs a person
        in on it.'
      summary: X-15 Switch user with a PIN on a registered device
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinSwitchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh
      summary: Rotate the refresh cookie and get a new access token
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/business/config:
    get:
      operationId: business_config
      summary: X-01 Branding, basics and maintenance for this business
      tags:
      - business
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessConfig'
          description: ''
  /api/v1/console/devices:
    get:
      operationId: console_devices_list
      summary: A-42 Registered devices
      tags:
      - console
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsoleDevice'
          description: ''
  /api/v1/console/devices/{id}/remove:
    post:
      operationId: console_devices_remove
      summary: A-42 Remove a device (ends every session on it)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - console
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/console/invitations:
    get:
      operationId: console_invitations_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - console
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
    post:
      operationId: console_invitations_create
      summary: A-41 Invite a person
      tags:
      - console
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/console/invitations/{id}/cancel:
    post:
      operationId: console_invitations_cancel
      summary: A-41 Cancel an invitation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - console
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/console/invitations/{id}/resend:
    post:
      operationId: console_invitations_resend
      summary: A-41 Resend an invitation (new link, 7 more days)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - console
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/console/sessions:
    get:
      operationId: console_sessions_list
      summary: A-42 Signed-in sessions
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - console
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionList'
          description: ''
  /api/v1/console/sessions/{id}/sign-out:
    post:
      operationId: console_sessions_sign_out
      summary: A-42 Sign a session out
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - console
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/devices/current:
    get:
      operationId: devices_current
      description: Identified by the das_device cookie, not by a signed-in person.
      summary: X-15 This device, its branch, lock state and who can switch in
      tags:
      - devices
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentDevice'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/health:
    get:
      operationId: health
      description: Checks the database and Redis. Returns 503 if either is failing.
        Answers on any host (it's exempt from business resolution).
      summary: Service health
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDegraded'
          description: ''
  /api/v1/me:
    get:
      operationId: me
      summary: The signed-in person
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/branches:
    get:
      operationId: me_branches
      summary: S-01 Branches I work at
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/me/pin:
    post:
      operationId: me_pin_set
      summary: Choose my 4-digit PIN for counter devices (first time)
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
  /api/v1/staff/devices:
    post:
      operationId: staff_devices_register
      summary: S-02 Register this device (signs you out of it)
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        '400':
          description: Error envelope
        '401':
          description: Error envelope
        '403':
          description: Error envelope
        '429':
          description: Error envelope with retry_after
components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
          description: Access token (15 minutes). Keep it in memory only.
      required:
      - access
    AppVersion:
      type: object
      properties:
        app:
          type: string
        platform:
          type: string
        minimum:
          type: string
        latest:
          type: string
      required:
      - app
      - latest
      - minimum
      - platform
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    BusinessConfig:
      type: object
      properties:
        business:
          $ref: '#/components/schemas/ConfigBusiness'
        branding:
          $ref: '#/components/schemas/ConfigBranding'
        maintenance:
          $ref: '#/components/schemas/Maintenance'
      required:
      - branding
      - business
      - maintenance
    CodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - code
    ConfigBranding:
      type: object
      properties:
        app_name:
          type: string
        logo_url:
          type: string
        primary_color:
          type: string
        accent_color:
          type: string
        support_phone:
          type: string
        whatsapp_phone:
          type: string
        terms_url:
          type: string
        privacy_url:
          type: string
      required:
      - accent_color
      - app_name
      - logo_url
      - primary_color
      - privacy_url
      - support_phone
      - terms_url
      - whatsapp_phone
    ConfigBusiness:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        country:
          type: string
        currency:
          type: string
        timezone:
          type: string
        language:
          type: string
      required:
      - country
      - currency
      - language
      - name
      - slug
      - timezone
    ConsoleDevice:
      type: object
      description: 'A-42: registered counter devices (name, branch, registered by,
        last used).'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branch:
          $ref: '#/components/schemas/Branch'
        status:
          type: string
        registered_by:
          $ref: '#/components/schemas/SessionPerson'
        last_seen_at:
          type: string
          format: date-time
          nullable: true
      required:
      - branch
      - id
      - last_seen_at
      - name
      - registered_by
      - status
    CurrentDevice:
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
        locked:
          type: boolean
        roster:
          type: array
          items:
            $ref: '#/components/schemas/RosterEntry'
      required:
      - device
      - locked
      - roster
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branch:
          $ref: '#/components/schemas/Branch'
        status:
          type: string
      required:
      - branch
      - id
      - name
      - status
    DeviceRegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: For example "Front counter tablet".
          maxLength: 60
        branch_id:
          type: string
          format: uuid
      required:
      - branch_id
      - name
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        checks:
          type: object
          additionalProperties:
            type: string
      required:
      - checks
      - status
    HealthDegraded:
      type: object
      properties:
        status:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
      required:
      - checks
      - status
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        rights:
          allOf:
          - $ref: '#/components/schemas/Rights'
          readOnly: true
        branch_ids:
          type: array
          items:
            type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        sent_count:
          type: integer
          readOnly: true
        is_open:
          type: boolean
          readOnly: true
      required:
      - branch_ids
      - expires_at
      - first_name
      - id
      - is_open
      - last_name
      - phone
      - rights
      - role
      - sent_count
    InvitationAcceptRequest:
      type: object
      properties:
        setup_token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - setup_token
    InvitationCreateRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
        first_name:
          type: string
          minLength: 1
          maxLength: 60
        last_name:
          type: string
          minLength: 1
          maxLength: 60
        role:
          $ref: '#/components/schemas/InvitationCreateRoleEnum'
        branch_ids:
          type: array
          items:
            type: string
            format: uuid
        rights:
          $ref: '#/components/schemas/RightsInputRequest'
      required:
      - first_name
      - last_name
      - phone
      - role
    InvitationCreateRoleEnum:
      enum:
      - manager
      - accountant
      - staff
      type: string
      description: |-
        * `manager` - Manager
        * `accountant` - Accountant
        * `staff` - Staff
    LanguageEnum:
      enum:
      - en
      - sw
      type: string
      description: |-
        * `en` - English
        * `sw` - Kiswahili
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - phone
    LoginResponse:
      type: object
      properties:
        access:
          type: string
          description: Access token (15 minutes). Keep it in memory only.
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    Maintenance:
      type: object
      properties:
        active:
          type: boolean
        expected_return:
          type: string
      required:
      - active
      - expected_return
    Me:
      type: object
      description: The signed-in person. Read-only; a plain serializer so no queries
        run to build it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/MeRoleEnum'
          readOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
        is_phone_verified:
          type: boolean
          readOnly: true
        rights:
          allOf:
          - $ref: '#/components/schemas/Rights'
          readOnly: true
        has_pin:
          type: boolean
          readOnly: true
      required:
      - first_name
      - has_pin
      - id
      - is_phone_verified
      - language
      - last_name
      - phone
      - rights
      - role
    MeRoleEnum:
      enum:
      - owner
      - manager
      - accountant
      - staff
      - rider
      - customer
      - platform_super_admin
      - platform_support
      - platform_finance
      type: string
      description: |-
        * `owner` - Owner
        * `manager` - Manager
        * `accountant` - Accountant
        * `staff` - Staff
        * `rider` - Rider
        * `customer` - Customer
        * `platform_super_admin` - Platform super admin
        * `platform_support` - Platform support
        * `platform_finance` - Platform finance
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    PaginatedInvitationList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    PaginatedSessionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    PhoneRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - phone
    PinRequest:
      type: object
      properties:
        pin:
          type: string
          minLength: 4
          maxLength: 4
      required:
      - pin
    PinSwitchRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        pin:
          type: string
          minLength: 4
          maxLength: 4
      required:
      - pin
      - user_id
    PublicInvitation:
      type: object
      description: 'What X-14 shows: "{Business} invited you to join as {role}" and
        the phone.'
      properties:
        business_name:
          type: string
        role:
          type: string
        role_label:
          type: string
        first_name:
          type: string
        phone:
          type: string
      required:
      - business_name
      - first_name
      - phone
      - role
      - role_label
    ResetConfirmRequest:
      type: object
      properties:
        reset_token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - reset_token
    ResetToken:
      type: object
      properties:
        reset_token:
          type: string
          description: Single use, valid for 10 minutes.
      required:
      - reset_token
    Rights:
      type: object
      properties:
        accept_cash:
          type: boolean
        give_discounts:
          type: boolean
        correct_prices:
          type: boolean
      required:
      - accept_cash
      - correct_prices
      - give_discounts
    RightsInputRequest:
      type: object
      properties:
        accept_cash:
          type: boolean
          default: false
        give_discounts:
          type: boolean
          default: false
        correct_prices:
          type: boolean
          default: false
    RosterEntry:
      type: object
      description: X-15 shows first name and surname initial ("Wanjiru K."); never
        phone numbers.
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_initial:
          type: string
          readOnly: true
        role:
          type: string
      required:
      - first_name
      - id
      - last_initial
      - role
    Session:
      type: object
      description: 'A-42: every signed-in session per person (device, browser, last
        active).'
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/SessionPerson'
        kind:
          type: string
        device:
          allOf:
          - $ref: '#/components/schemas/SessionDevice'
          nullable: true
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_current:
          type: boolean
          readOnly: true
      required:
      - created_at
      - device
      - id
      - is_current
      - kind
      - last_seen_at
      - user
      - user_agent
    SessionDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    SessionPerson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
      required:
      - first_name
      - id
      - last_name
      - role
    SetupToken:
      type: object
      properties:
        setup_token:
          type: string
          description: Single use, valid for 10 minutes.
      required:
      - setup_token
    StatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    VerifyCodeRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
        code:
          type: string
          minLength: 1
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - code
      - phone
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/login or /auth/refresh (15 minutes).
